<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; }
    .login-box {
      width: 240px;
      margin: 80px auto;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
      text-align: center;
    }
    input {
      width: 90%;        
      padding: 6px;
      margin: 6px auto;
      display: block;    
      font-size: 14px;
    }
    button {
      width: 90%;        
      padding: 8px;
      background: #007bff;
      color: white;
      border: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>ログイン</h2>
    <form action="login.php" method="post">
      <input type="text" name="username" placeholder="ユーザー名" required>
      <input type="password" name="password" placeholder="パスワード" required>
      <button type="submit">ログイン</button>
    </form>
  </div>
</body>
</html>

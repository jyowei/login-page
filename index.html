<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; }
    .login-box {
      width: 3500px; 
      margin: 150px auto;
      padding: 15px;
      background: white; 
      border-radius: 8px; 
      box-shadow: 0 0 10px #ccc;
    }
    input { 
      width: 100%; 
      padding: 6px; 
      margin: 6px 0; 
      font-size: 14px;
    }
    button { 
      width: 100%; 
      padding: 10px; 
      background: #007bff; 
      color: white; 
      border: none; 
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>ログイン</h2>
    <form action="login.php" method="post">
      <input type="text" name="username" placeholder="ユーザー名" required>
      <input type="password" name="password" placeholder="パスワード" required>
      <button type="submit">ログイン</button>
    </form>
  </div>
</body>
</html>
